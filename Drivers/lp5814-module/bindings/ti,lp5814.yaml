description: >
  Texas Instruments LP5814 4-channel LED driver used as a display backlight.
  The outputs selected by channels are driven together with manual PWM dimming.

include: ["i2c-device.yaml"]

compatible: "ti,lp5814"

bus: i2c

properties:
  channels:
    type: int
    default: 15
    description: Bit mask of the outputs OUT0 to OUT3 that drive the backlight
  high-current:
    type: boolean
    default: false
    description: Use the 51 mA maximum output current range instead of 25.5 mA
  dot-current:
    type: int
    default: 255
    description: Output current as a fraction of the maximum current [0,255]
  brightness-default:
    type: int
    default: 255
    description: Default brightness level, applied by set_brightness_default()
